name: InfoPrepaga CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: crm_test
          POSTGRES_PASSWORD: ci-synthetic-only
          POSTGRES_DB: starter_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U crm_test -d starter_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CRM_TEST_DATABASE_URL: postgresql://crm_test:ci-synthetic-only@127.0.0.1:5432/starter_test
      DATABASE_URL: postgresql://crm_test:ci-synthetic-only@127.0.0.1:5432/starter_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            backend/pnpm-lock.yaml
            frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pypdf==6.10.0
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test --runInBand
      - run: pnpm test:e2e --runInBand
      - run: pnpm build
      - name: Install frontend for BFF integration
        run: pnpm -C ../frontend install --frozen-lockfile
      - name: Build frontend for BFF integration
        run: pnpm -C ../frontend build
        env:
          BUILD_STANDALONE: 'true'
      - name: Install isolated browser test tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/import-browser" --no-package-lock --ignore-scripts playwright@1.62.1
          node "$RUNNER_TEMP/import-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify Next.js and NestJS integration with disposable PostgreSQL
        run: node ../scripts/verify-crm.mjs
        env:
          CRM_RUN_IMPORT_UI: 'true'
          CRM_UI_BROWSER: bundled
          NODE_PATH: ${{ runner.temp }}/import-browser/node_modules
      - run: pnpm audit --prod --audit-level=low
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint:strict
      - run: pnpm typecheck
      - run: pnpm build
        env:
          BUILD_STANDALONE: 'true'
      - run: node --experimental-strip-types scripts/verify-followups.mjs
      - run: node --experimental-strip-types scripts/verify-lead-profile.mjs
      - run: node --experimental-strip-types scripts/verify-avalian.mjs
      - run: node --experimental-strip-types scripts/verify-crm-profile.mjs
      - run: node --experimental-strip-types scripts/verify-sessions.mjs
      - run: node --experimental-strip-types scripts/verify-reports.mjs
      - run: pnpm audit --prod --audit-level=low
